name: Remote Auto-Merge Without Conflicts

on:
  workflow_dispatch:
    inputs:
      repo_b_url:
        description: 'https://github.com/Kishan-shah12/MINI-poke.git'
        required: true
      repo_b_branch:
        description: 'Branch of Repo B to merge'
        required: true
        default: 'main'
      subfolder_name:
        description: 'Target subfolder inside Repo A for Repo B files'
        required: true
        default: 'repo-b-files'

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo A
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Repo B into Subfolder
        run: |
          # 1. Add Repo B as a remote and fetch its history
          git remote add incoming "${{ inputs.repo_b_url }}"
          git fetch incoming "${{ inputs.repo_b_branch }}"

          # 2. Merge Repo B using subtree strategy to isolate into a folder
          git merge -s subtree \
            -Xsubtree="${{ inputs.subfolder_name }}" \
            --allow-unrelated-histories \
            -m "Merge ${{ inputs.repo_b_url }} into ${{ inputs.subfolder_name }}" \
            "incoming/${{ inputs.repo_b_branch }}"

          # 3. Push the combined history back to Repo A
          git push origin HEAD
